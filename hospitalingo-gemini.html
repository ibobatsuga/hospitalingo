<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HospitaLingo — English for Hospitality</title>
  <style>
    :root{--ink:#24211e;--muted:#7d7974;--paper:#f7f4ee;--card:#fffefa;--line:#eae2d7;--orange:#f58d16;--orange2:#ffbd62;--brown:#2b241d;--blue:#eef5f6;--shadow:0 22px 60px rgba(83,53,22,.11)}

    .shell{min-height:100vh;display:flex}.sidebar{width:246px;height:100vh;position:sticky;top:0;padding:29px 21px 20px;display:flex;flex-direction:column;background:var(--brown);color:#fff}.brand{display:flex;align-items:center;gap:10px;border:0;background:none;color:#fff;font-size:20px;font-weight:850;cursor:pointer}.brand-mark{width:38px;height:38px;display:grid;place-items:center;border-radius:50% 50% 50% 13px;background:linear-gradient(145deg,#ffb343,#ef7b08);box-shadow:0 9px 24px rgba(245,141,22,.32)}.brand em{color:#ff9b22;font-style:normal}.nav{display:grid;gap:7px;margin-top:45px}.nav button{border:0;background:transparent;color:#c9beb2;padding:12px 13px;border-radius:12px;display:flex;align-items:center;gap:12px;text-align:left;cursor:pointer}.nav button.active,.nav button:hover{color:#fff;background:rgba(255,164,44,.14);box-shadow:inset 3px 0 #ff9c20}.nav button span{font-size:20px}.nav-label{margin:32px 12px 10px;padding-top:25px;border-top:1px solid rgba(255,255,255,.1);color:#94887d;font-size:9px;font-weight:800;letter-spacing:1.5px}.skill-links{display:grid}.skill-links button{border:0;background:transparent;color:#c9beb2;padding:9px 12px;text-align:left;cursor:pointer}.skill-links button:before{content:"";width:8px;height:8px;margin-right:11px;display:inline-block;border-radius:50%;background:#ffb64f}.profile-mini{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px}.avatar{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;background:#ff9b1e;color:#fff;font-size:11px;font-weight:850}.profile-mini div{display:grid;gap:2px}.profile-mini strong{font-size:11px}.profile-mini small{color:#9d9187;font-size:8px}

nsparent 32%),linear-gradient(155deg,#ff8a0b,#ffa326 56%,#ffc36c);color:#fff;box-shadow:0 24px 50px rgba(224,111,0,.24)}.prompt{max-width:84%;margin:-49px auto 21px;padding:12px 17px;position:relative;border:1px solid #eee0cf;border-radius:17px 17px 17px 5px;background:#fff9f2;color:#4b433a;font-size:11px;box-shadow:0 10px 25px rgba(95,52,10,.1)}.stage-top{width:100%;display:flex;align-items:center;justify-content:space-between}.faces{display:flex}.faces b{width:29px;height:29px;margin-left:-6px;display:grid;place-items:center;border:2px solid var(--orange);border-radius:50%;background:#fff;color:#b76206;font-size:8px}.faces b:first-child{margin:0}.more{width:34px;height:34px;border:0;border-radius:50%;background:rgba(255,255,255,.17);color:#fff;cursor:pointer}.stage h2{max-width:390px;margin:30px 0 22px;text-align:center;font-family:Georgia,serif;font-size:clamp(21px,2.2vw,29px);font-weight:400;line-height:1.2}.controls{display:flex;align-items:center;gap:24px}.controls button{width:51px;height:51px;border:0;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;cursor:pointer}.controls .mic{width:79px;height:79px;border:9px solid rgba(255,255,255,.24);background:#fff;color:var(--orange);box-shadow:0 0 0 7px rgba(255,255,255,.14);font-size:18px}.controls .mic.listening{animation:pulse 1s infinite;background:#fff0e8;color:#e04d24}.caption{margin-top:17px;color:rgba(255,255,255,.8);font-size:9px}.start{width:100%;margin-top:auto;padding:14px 18px;border:0;border-radius:15px;background:#fff;color:#292521;font-size:11px;font-weight:800;cursor:pointer}.nudge{margin-top:14px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border-radius:15px;background:#fff6e8}.nudge span{color:#bd721b;font-size:7px;font-weight:900;letter-spacing:1px}.nudge p{margin:0;color:#60574f;font-size:10px}.nudge button{border:0;background:none;color:#d77006;font-size:8px;font-weight:800;cursor:pointer}
    .community{display:grid;align-content:start;gap:18px}.heading{display:flex;align-items:end;justify-content:space-between}.heading h2{margin:5px 0 0;font-family:Georgia,serif;font-size:24px;font-weight:500}.link{border:0;background:none;color:#e37a0c;font-size:9px;font-weight:800;cursor:pointer}.scenes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.scene{min-height:185px;padding:0;position:relative;overflow:hidden;border:0;border-radius:23px;background:#ddd;text-align:left;color:#fff;cursor:pointer;box-shadow:0 12px 25px rgba(74,49,23,.09)}.scene img{width:100%;height:100%;position:absolute;inset:0;object-fit:cover;transition:.35s}.scene:hover img{transform:scale(1.05)}.scene:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(29,20,13,.86),transparent 67%)}.scene-tag{position:absolute;right:11px;top:11px;z-index:2;padding:6px 9px;border-radius:999px;background:rgba(245,141,22,.92);font-size:7px;font-weight:800}.scene-copy{position:absolute;left:15px;right:13px;bottom:13px;z-index:2;display:grid;gap:3px}.scene-copy strong{font-family:Georgia,serif;font-size:14px;font-weight:500}.scene-copy small{color:rgba(255,255,255,.75);font-size:8px}.path{padding:18px;border:1px solid var(--line);border-radius:23px;background:var(--card)}.path-title{display:flex;align-items:end;justify-content:space-between;margin-bottom:7px}.path-title h3{margin:4px 0 0;font-family:Georgia,serif;font-size:19px;font-weight:500}.path-title>span{color:#948c84;font-size:8px}.lessons{display:grid}.lesson{padding:9px 1px;display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;border:0;border-bottom:1px solid #f0ebe4;background:none;text-align:left;cursor:pointer}.lesson:last-child{border:0}.lesson .num{width:30px;height:30px;display:grid;place-items:center;border-radius:10px;background:#ffe0b9;color:#b66008;font-size:8px;font-weight:900}.lesson>span:nth-child(2){display:grid;gap:2px}.lesson strong{font-size:10px}.lesson small,.lesson b     .page{max-width:930px;margin:auto;padding:42px 34px 85px}.page-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:24px}.page-head h1{margin:6px 0 0;font-family:Georgia,serif;font-size:39px;font-weight:500}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:8px;cursor:pointer}.tabs button.active{border-color:var(--orange);background:var(--orange);color:#fff}.practice-card{padding:38px;overflow:hidden;border:1px solid var(--line);border-radius:27px;background:#fff;box-shadow:var(--shadow)}.practice-card h2{margin:12px 0;font-family:Georgia,serif;font-size:31px;font-weight:500}.practice-card p{color:var(--muted);font-size:11px;line-height:1.6}.record-zone{margin:23px 0;padding:27px;display:grid;place-items:center;gap:8px;border:1px dashed #e5c391;border-radius:20px;background:#fff9ef}.big-mic{width:72px;height:72px;border:8px solid #ffe1b8;border-radius:50%;background:var(--orange);color:#fff;cursor:pointer}.record-zone small{color:#998e82;font-size:8px}.answer{width:100%;min-height:86px;padding:13px;border:1px solid var(--line);border-radius:13px;resize:vertical;outline:none}.primary{margin-top:13px;padding:13px 18px;border:0;border-radius:13px;background:linear-gradient(135deg,#f69a27,#e97707);color:#fff;font-size:10px;font-weight:800;cursor:pointer}.wide{width:100%}.feedback{margin-top:15px;padding:15px;border-radius:14px;background:#eff8ee;color:#396341;font-size:10px;line-height:1.5}.vocab-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.vocab{padding:21px;border:1px solid var(--line);border-radius:18px;background:#fffaf2;cursor:pointer}.vocab h3{margin:0 0 7px;font-family:Georgia,serif;font-size:21px}.vocab span{color:#c56c08;font-size:9px}.vocab p{margin-bottom:0}.chat{min-height:330px;max-height:420px;padding:20px;overflow:auto;display:flex;flex-direction:column;gap:10px;border-radius:18px;background:#faf8f3}.msg{max-width:76%;padding:11px 13px;border-radius:14px;background:#eee8df;font-size:10px;line-height:1.45}.msg.user{align-self:flex-end;background:var(--orange);color:#fff}.composer{margin-top:12px;display:grid;grid-template-columns:1fr auto;gap:8px}.composer input{padding:12px;border:1px solid var(--line);border-radius:12px;outline:none}.composer button{width:42px;border:0;border-radius:12px;background:var(--orange);color:#fff;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:20px;border:1px solid var(--line);border-radius:19px;background:#fff}.stat:first-child{background:var(--brown);color:#fff}.stat span{color:#918a82;font-size:8px}.stat:first-child span{color:#c9bfb5}.stat strong{margin-top:7px;display:block;font-size:29px}.progress-list{margin-top:18px;padding:22px;border:1px solid var(--line);border-radius:20px;background:#fff}.bar-row{padding:10px 0;display:grid;grid-template-columns:100px 1fr 35px;gap:12px;align-items:center;font-size:9px}.bar{height:8px;overflow:hidden;border-radius:10px;background:#eee8df}.bar i{height:100%;display:block;border-radius:10px;background:linear-gradient(90deg,var(--orange),var(--orange2))}
    .onboarding{min-height:100vh;padding:35px 18px;display:grid;place-items:center;background-color:#f7f9ff;background-image:linear-gradient(#e9effc 1px,transparent 1px),linear-gradient(90deg,#e9effc 1px,transparent 1px);background-size:30px 30px}.setup{width:min(620px,100%);padding:42px;border-radius:29px;background:#fff;box-shadow:0 25px 70px rgba(52,86,157,.14);border-top:4px solid var(--orange)}.setup-brand{display:flex;justify-content:center;margin-bottom:25px}.setup-brand .brand{color:var(--ink)}.setup h1{text-align:center;margin:0;font-size:32px}.setup>p{text-align:center;color:#78849a;font-size:12px;line-height:1.6}.form{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:28px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:9px;font-weight:800}.field input,.field select{width:100%;padding:13px;border:1px solid #dce4f1;border-radius:12px;background:#fafcff;outline:none}.field input:focus,.field select:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(245,141,22,.11)}.setup .primary{grid-column:1/-1;margin-top:4px;padding:15px}.test-prompt{grid-column:1/-1;padding:14px;display:flex;align-items:center;justify-content:space-between;border:1px solid #f3d7a7;border-radius:13px;background:#fff7e8}.test-prompt strong{font-size:10px}.test-prompt small{display:block;margin-top:3px;color:#8d7e69;font-size:8px}.test-prompt button{border:0;background:none;color:#d77408;font-size:9px;font-weight:800;cursor:pointer}
    .modal{position:fixed;inset:0;z-index:60;padding:18px;display:grid;place-items:center;background:rgba(31,24,18,.58);backdrop-filter:blur(7px)}.modal-card{width:min(500px,100%);padding:29px;position:relative;border-radius:24px;background:#fff}.close{position:absolute;right:17px;top:14px;border:0;background:none;font-size:20px;cursor:pointer}.modal-card h2{font-family:Georgia,serif;font-size:27px;font-weight:500}.options{display:grid;gap:8px}.options button{padding:12px;border:1px solid var(--line);border-radius:11px;background:#fffaf3;text-align:left;cursor:pointer}.options button:hover{border-color:var(--orange)}.bottom-nav{display:none}@keyframes pulse{50%{box-shadow:0 0 0 13px rgba(245,141,22,0)}0%,100%{box-shadow:0 0 0 0 rgba(245,141,22,.3)}}
    @media(max-width:1080px){.dashboard{grid-template-columns:1fr;max-width:760px}.community{grid-template-columns:1fr 1fr}.heading,.scenes{grid-column:1/-1}.stats{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:720px){.sidebar{display:none}.workspace{width:100%;padding-bottom:66px}.topbar{height:63px;padding:0 16px}.mobile-brand{display:flex;align-items:center;gap:8px;font-weight:850}.mobile-brand .brand-mark{width:30px;height:30px}.chip{display:none}.dashboard,.page{padding:18px 13px 85px}.focus{padding:17px;border-radius:27px}.person strong{font-size:15px}.level{margin-top:17px}.unit{align-items:flex-start}.unit h1{font-size:27px}.stage{margin-top:39px;min-height:390px}.community{margin-top:27px;display:grid;grid-template-columns:1fr}.heading,.scenes{grid-column:auto}.scene{min-height:168px}.page-head{align-items:flex-start;flex-direction:column}.tabs{width:100%;flex-wrap:nowrap;overflow:auto}.practice-card{padding:24px 17px}.stats{grid-template-columns:1fr 1fr}.setup{padding:29px 20px}.form{grid-template-columns:1fr}.field.full,.test-prompt,.setup .primary{grid-column:auto}.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:8px 14px max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:rgba(255,254,250,.96);backdrop-filter:blur(12px)}.bottom-nav button{border:0;background:none;display:grid;justify-items:center;gap:2px;color:#99918a;font-size:8px}.bottom-nav button span{font-size:17px}.bottom-nav button.active{color:var(--orange);font-weight:850}}
    @media(max-width:410px){.scenes{gap:9px}.scene{min-height:155px;border-radius:19px}.scene-tag{display:none}.nudge{grid-template-columns:1fr auto}.nudge>span{grid-column:1/-1}.controls{gap:19px}}

<body>
  <div id="app"></div>
  <script>
    const scenes=[
      {title:'Hotel check-in',sub:'Welcome a new guest',img:'https://images.unsplash.com/photo-1556740749-887f6717d7e4?auto=format&fit=crop&w=900&q=85'},
      {title:'At the restaurant',sub:'Take a dinner order',img:'https://images.unsplash.com/photo-1569683236049-bc137196a02a?auto=format&fit=crop&w=900&q=85'},
      {title:'Coffee break',sub:'Chat with a guest',img:'https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=900&q=85'},
      {title:'Handle a request',sub:'Respond with confidence',img:'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=900&q=85'}
    ];
    const lessons=[['Vocabulary','8 useful hotel words','3'],['Listening','A guest arrival','3'],['Grammar','May I help you?','3'],['Speaking','Welcome your guest','4'],['Conversation','Roleplay with Mia','5']];
    const words=[['reservation','pemesanan','I have a reservation under the name Lee.'],['available','tersedia','Is an early check-in available?'],['luggage','barang bawaan','May I help you with your luggage?'],['complimentary','gratis','Breakfast is complimentary.']];
    const state={profile:JSON.parse(localStorage.getItem('hospitalingo_profile')||'null'),view:'home',skill:'Speaking',done:JSON.parse(localStorage.getItem('hospitalingo_done')||'[]'),messages:[{who:'ai',text:'Good evening! Welcome to Sunrise Hotel. How may I help you?'}],listening:false};
    const el=id=>document.getElementById(id);
    function save(){localStorage.setItem('hospitalingo_done',JSON.stringify(state.done))}
    function complete(name){if(!state.done.includes(name)){state.done.push(name);save()}}
    function speak(text){if(!('speechSynthesis'in window))return; speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.9;speechSynthesis.speak(u)}
    function listen(target){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){alert('Speech recognition is not available in this browser. You can type your answer instead.');return}const r=new R();r.lang='en-US';r.interimResults=false;state.listening=true;render();r.onresult=e=>{const t=e.results[0][0].transcript;if(target==='answer')el('answer').value=t;else el('chatInput').value=t};r.onend=()=>{state.listening=false;render()};r.onerror=()=>{state.listening=false;render()};r.start()}
    function nav(view){state.view=view;render();window.scrollTo(0,0)}
    function startSkill(skill){state.skill=skill;state.view='practice';render();window.scrollTo(0,0)}
    function onboarding(){return `<main class="onboarding"><section class="setup"><div class="setup-brand"><div class="brand"><span class="brand-mark">H</span><span>Hospita<em>Lingo</em></span></div></div><h1>Welcome!</h1><p>Set up your profile so your AI tutor can adapt every lesson to your hospitality role.</p><div class="form"><div class="field full"><label>YOUR NAME</label><input id="name" placeholder="For example: Bobi" value="Bobi"></div><div class="field"><label>YOUR ROLE</label><select id="role"><option>Hotel staff</option><option>Restaurant staff</option><option>Tourism professional</option><option>Student</option></select></div><div class="field"><label>ENGLISH LEVEL</label><select id="level"><option value="A1">A1 · Beginner</option><option value="A2" selected>A2 · Elementary</option><option value="B1">B1 · Intermediate</option><option value="B2">B2 · Upper intermediate</option></select></div><div class="test-prompt"><div><strong>Not sure about your level?</strong><small>Take a quick free check with AI.</small></div><button onclick="openPlacement()">Start test →</button></div><button class="primary" onclick="saveProfile()">Save profile & start learning →</button></div></section></main>`}
    function shell(content){const name=state.profile.name||'Bobi';return `<main class="shell"><aside class="sidebar"><button class="brand" onclick="nav('home')"><span class="brand-mark">H</span><span>Hospita<em>Lingo</em></span></button><nav class="nav"><button class="${state.view==='home'?'active':''}" onclick="nav('home')"><span>⌂</span>Today</button><button class="${state.view==='practice'?'active':''}" onclick="nav('practice')"><span>◎</span>Practice</button><button class="${state.view==='progress'?'active':''}" onclick="nav('progress')"><span>↗</span>Progress</button></nav><div class="nav-label">YOUR SKILLS</div><div class="skill-links">${lessons.map(x=>`<button onclick="startSkill('${x[0]}')">${x[0]}</button>`).join('')}</div><div class="profile-mini"><div class="avatar">${name.slice(0,2).toUpperCase()}</div><div><strong>${name}</strong><small>${state.profile.level} hospitality learner</small></div></div></aside><section class="workspace"><header class="topbar"><div class="mobile-brand"><span class="brand-mark">H</span>HospitaLingo</div><div class="chip">UNIT 01 <span>· Everyday hospitality</span></div><div class="top-actions"><span>🔥 6 day streak</span><button class="bell">♢</button></div></header>${content}<nav class="bottom-nav"><button class="${state.view==='home'?'active':''}" onclick="nav('home')"><span>⌂</span>Today</button><button class="${state.view==='practice'?'active':''}" onclick="nav('practice')"><span>◎</span>Practice</button><button class="${state.view==='progress'?'active':''}" onclick="nav('progress')"><span>↗</span>Progress</button></nav></section></main>`}
    function home(){const p=Math.round(state.done.length/lessons.length*100),name=state.profile.name;return shell(`<div class="dashboard"><section class="focus"><div class="welcome"><div class="person"><img class="portrait" src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=260&q=85" alt=""><div><span>Good to see you</span><strong>Welcome back, ${name}</strong></div></div><button class="round">♢</button></div><section class="level"><div><small>LEVEL ${state.profile.level}</small><strong>Building confidence</strong></div><div class="fire">🔥 <b>6</b></div><div class="segments">${[0,1,2,3].map((_,i)=>`<i class="${i<=Math.floor(p/25)?'on':''}"></i>`).join('')}</div></section><div class="unit"><div><span class="kicker">UNIT 1 · LESSON 04</span><h1>Simple guest conversations</h1><p>Build the phrases you need to welcome, help, and delight every guest.</p></div><div class="count">▣ 16 lessons</div></div><section class="stage"><div class="prompt">Let’s welcome a guest who has just arrived.</div><div class="stage-top"><div class="faces"><b>B</b><b>M</b><b>A</b></div><button class="more">•••</button></div><h2>“Good evening. Welcome to our hotel.”</h2><div class="controls"><button onclick="speak('Good evening. Welcome to our hotel.')">▶</button><button class="mic ${state.listening?'listening':''}" onclick="listen('answer')">●</button><button onclick="startSkill('Conversation')">•••</button></div><span class="caption">Ask anything · Speak naturally</span><button class="start" onclick="startSkill('Speaking')">Start speaking →</button></section><div class="nudge"><span>AI COACH</span><p>Try adding: <b>“How was your journey?”</b></p><button onclick="speak('How was your journey?')">Hear it ↗</button></div></section><aside class="community"><div class="heading"><div><span class="kicker">PRACTICE LIBRARY</span><h2>Choose your scene</h2></div><button class="link" onclick="nav('practice')">See all →</button></div><div class="scenes">${scenes.map((s,i)=>`<button class="scene" onclick="startSkill('${i===3?'Speaking':'Conversation'}')"><img src="${s.img}" alt=""><span class="scene-tag">Start speaking</span><span class="scene-copy"><strong>${s.title}</strong><small>${s.sub}</small></span></button>`).join('')}</div><section class="path"><div class="path-title"><div><span class="kicker">TODAY'S PATH</span><h3>Five small wins</h3></div><span>${state.done.length}/5 done</span></div><div class="lessons">${lessons.map((x,i)=>`<button class="lesson" onclick="startSkill('${x[0]}')"><span class="num">${state.done.includes(x[0])?'✓':i+1}</span><span><strong>${x[0]}</strong><small>${x[1]}</small></span><b>${x[2]}m</b></button>`).join('')}</div></section><button class="placement" onclick="openPlacement()"><span class="badge">${state.profile.level}</span><span><strong>Find your best starting level</strong><small>Take a free 2-minute check</small></span><span>→</span></button></aside></div>`)}
    function practiceBody(){if(state.skill==='Vocabulary')return `<div class="vocab-grid">${words.map(w=>`<button class="vocab" onclick="speak('${w[0]}')"><h3>${w[0]}</h3><span>${w[1]} · ▶ hear</span><p>“${w[2]}”</p></button>`).join('')}</div><button class="primary wide" onclick="complete('Vocabulary');render()">Complete vocabulary</button>`;if(state.skill==='Conversation')return `<div class="chat" id="chat">${state.messages.map(m=>`<div class="msg ${m.who==='user'?'user':''}">${m.text}</div>`).join('')}</div><div class="composer"><input id="chatInput" placeholder="Reply in English…" onkeydown="if(event.key==='Enter')sendChat()"><button onclick="sendChat()">→</button></div><button class="link" onclick="listen('chat')">● Speak your reply</button>`;if(state.skill==='Listening')return `<h2>Listen for the main idea</h2><p>Tap play, then choose what the guest requested.</p><button class="primary" onclick="speak('Excuse me. Could I have an extra towel sent to room 402, please?')">▶ Play audio</button><div class="options" style="margin-top:18px"><button onclick="answerListen(false)">A table for two</button><button onclick="answerListen(true)">An extra towel</button><button onclick="answerListen(false)">A late checkout</button></div><div id="listenFeedback"></div>`;if(state.skill==='Grammar')return `<h2>May I + action + for you?</h2><p>Use this pattern to offer polite help without sounding too direct.</p><div class="options"><button onclick="speak('May I help you with your luggage?')">May I help you with your luggage? ▶</button><button onclick="speak('May I confirm your room number?')">May I confirm your room number? ▶</button><button onclick="speak('May I call a taxi for you?')">May I call a taxi for you? ▶</button></div><button class="primary wide" onclick="complete('Grammar');startSkill('Speaking')">Try it out loud →</button>`;return `<h2>Welcome a guest and offer help with their luggage.</h2><p>Say at least one complete, polite sentence. Speak naturally—your coach will check the wording.</p><div class="record-zone"><button class="big-mic" onclick="listen('answer')">${state.listening?'■':'●'}</button><strong>${state.listening?'Listening…':'Tap and speak'}</strong><small>or type your answer below</small></div><textarea class="answer" id="answer" placeholder="Good evening. Welcome to…"></textarea><button class="primary wide" onclick="checkSpeaking()">Check my answer →</button><div id="speakingFeedback"></div>`}
    function practice(){return shell(`<div class="page"><div class="page-head"><div><span class="kicker">UNIT 01 · REAL HOTEL ENGLISH</span><h1>${state.skill}</h1></div><div class="tabs">${lessons.map(x=>`<button class="${state.skill===x[0]?'active':''}" onclick="startSkill('${x[0]}')">${x[0]}</button>`).join('')}</div></div><section class="practice-card">${practiceBody()}</section></div>`)}
    function progress(){const stats=[['Weekly XP',320+state.done.length*35],['Speaking time','42 min'],['Words mastered','68'],['Current streak','6 days']];return shell(`<div class="page"><div class="page-head"><div><span class="kicker">YOUR LEARNING SIGNALS</span><h1>Small steps, real progress.</h1></div></div><div class="stats">${stats.map(x=>`<div class="stat"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}</div><section class="progress-list"><div class="path-title"><div><span class="kicker">SKILL MASTERY</span><h3>Building toward B1</h3></div></div>${[['Listening',72],['Vocabulary',64],['Conversation',58],['Speaking',54],['Grammar',46]].map(x=>`<div class="bar-row"><strong>${x[0]}</strong><div class="bar"><i style="width:${x[1]}%"></i></div><b>${x[1]}%</b></div>`).join('')}</section></div>`)}
    function render(){el('app').innerHTML=!state.profile?onboarding():state.view==='home'?home():state.view==='progress'?progress():practice()}
    function saveProfile(){const name=el('name').value.trim()||'Bobi';state.profile={name,role:el('role').value,level:el('level').value};localStorage.setItem('hospitalingo_profile',JSON.stringify(state.profile));render()}
    function resetProfile(){localStorage.removeItem('hospitalingo_profile');localStorage.removeItem('hospitalingo_done');state.profile=null;state.done=[];render()}
    function checkSpeaking(){const t=el('answer').value.trim(),box=el('speakingFeedback');if(!t){box.innerHTML='<div class="feedback" style="background:#fff1e7;color:#8c4e24">Say or type a sentence first.</div>';return}const polite=/may i|could i|welcome|please/i.test(t),score=Math.min(96,68+(polite?18:0)+(t.split(/\s+/).length>6?10:0));box.innerHTML=`<div class="feedback"><b>${score}/100 · ${polite?'Natural and welcoming':'Good start'}</b><br>${polite?'Your tone is polite and guest-ready.':'Try adding “May I…” or “Welcome to…” for a warmer tone.'}</div>`;complete('Speaking')}
    function answerListen(ok){el('listenFeedback').innerHTML=`<div class="feedback" style="background:${ok?'#eff8ee':'#fff1e7'};color:${ok?'#396341':'#8c4e24'}">${ok?'Correct! You caught the key request.':'Listen again for the words “extra towel”.'}</div>`;if(ok)complete('Listening')}
    function sendChat(){const input=el('chatInput'),text=input.value.trim();if(!text)return;state.messages.push({who:'user',text});const replies=['Certainly. May I have the name on your reservation?','Thank you. Your room is ready. May I help you with your luggage?','Wonderful. Breakfast is complimentary and starts at 6:30 AM.'];state.messages.push({who:'ai',text:replies[(state.messages.length-1)%replies.length]});if(state.messages.length>=6)complete('Conversation');render()}
    let q=0,score=0;const questions=[['Choose the most polite welcome.',['You need something?','Good evening. How may I help you?','Tell me your name.'],1],['A guest asks for another towel. You say…',['Wait.','I do not know.','Certainly. I’ll send one to your room.'],2],['Complete: May I help you ___ your luggage?',['with','at','on'],0]];
    function openPlacement(){q=0;score=0;showQuestion()}
    function showQuestion(){const old=el('placementModal');if(old)old.remove();const x=questions[q];document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="placementModal"><section class="modal-card"><button class="close" onclick="el('placementModal').remove()">×</button><span class="kicker">QUICK LEVEL CHECK · ${q+1}/3</span><h2>${x[0]}</h2><div class="options">${x[1].map((a,i)=>`<button onclick="answerPlacement(${i})">${String.fromCharCode(65+i)} · ${a}</button>`).join('')}</div></section></div>`)}
    function answerPlacement(i){if(i===questions[q][2])score++;q++;if(q<questions.length)showQuestion();else{const level=score===3?'B1':score===2?'A2':'A1';el('placementModal').innerHTML=`<section class="modal-card" style="text-align:center"><span class="kicker">YOUR STARTING LEVEL</span><h2>${level} · ${level==='B1'?'Intermediate':level==='A2'?'Elementary':'Beginner'}</h2><p>Your learning path will adapt to practical hospitality situations.</p><button class="primary wide" onclick="applyLevel('${level}')">Use this level →</button></section>`}}
    function applyLevel(level){if(state.profile){state.profile.level=level;localStorage.setItem('hospitalingo_profile',JSON.stringify(state.profile))}el('placementModal').remove();render()}
    render();
  </script>
</body>
</html>
